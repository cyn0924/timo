    <link rel="stylesheet" crossorigin href="/timo/assets/index-BXomNhlZ.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const base = '/timo/';
        const params = new URLSearchParams(window.location.search);
        const restoredPath = params.get('__spa_path');
        if (restoredPath && restoredPath.startsWith('/') && !restoredPath.startsWith('//')) {
          window.history.replaceState(null, '', `${base}${restoredPath.slice(1)}`);
        }
      })();
    </script>
  </body>
